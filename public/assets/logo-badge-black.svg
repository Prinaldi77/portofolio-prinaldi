<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" role="img" aria-label="Prinaldi" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .stem{animation:drop .55s cubic-bezier(.2,.9,.2,1) both}
  .bowl{animation:slide .55s .12s cubic-bezier(.2,.9,.2,1) both}
  .cur{transform-box:fill-box;transform-origin:50% 100%;animation:pop .3s .38s cubic-bezier(.2,.9,.2,1) both,blink 1.2s 1.1s steps(1,end) infinite}
  @keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
  @keyframes slide{from{transform:translateX(44px);opacity:0}to{transform:none;opacity:1}}
  @keyframes pop{from{transform:scaleY(0)}to{transform:none}}
  @keyframes blink{0%{opacity:1}55%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.stem,.bowl,.cur{animation:none}}
</style>
<rect width="48" height="48" rx="10" fill="#000000"/>
<g transform="translate(5.4 6) scale(.31)" fill="#FFFFFF">
  <path class="stem" d="M20 10H44V110L20 86Z"/>
  <path class="bowl" fill-rule="evenodd" d="M50 10H86L104 28V56L86 74H50V52H74L80 46V38L74 32H50Z"/>
  <path class="cur" d="M50 80H90L78 110H50Z"/>
</g>
</svg>