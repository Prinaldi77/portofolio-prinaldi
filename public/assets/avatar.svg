<svg width="400" height="480" viewBox="0 0 400 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dotPattern" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#D4D4D8"/>
    </pattern>
    <linearGradient id="avatarGrad" x1="200" y1="120" x2="200" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18181B"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>
  </defs>

  <!-- Background with Halftone Dot Grid -->
  <rect width="400" height="480" rx="30" fill="#F4F4F5"/>
  <rect width="400" height="480" rx="30" fill="url(#dotPattern)" opacity="0.7"/>

  <!-- Crown / Star Doodle Motif -->
  <path d="M160 90 L180 115 L200 80 L220 115 L240 90 L235 125 L165 125 Z" fill="#000000"/>

  <!-- Stylized Developer Silhouette with Cap & Headphones -->
  <circle cx="200" cy="180" r="55" fill="#18181B"/>
  <path d="M140 170 Q200 130 260 170" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
  <!-- Headphone Band -->
  <path d="M135 180 C135 130 265 130 265 180" stroke="#27272A" stroke-width="6" fill="none"/>
  <rect x="130" y="170" width="16" height="28" rx="8" fill="#52525B"/>
  <rect x="254" y="170" width="16" height="28" rx="8" fill="#52525B"/>

  <!-- Body / Hoodie with T-shirt Graphic -->
  <path d="M100 480 C100 290 140 250 200 250 C260 250 300 290 300 480 Z" fill="url(#avatarGrad)"/>
  
  <!-- Hoodie details & phone/hand silhouette -->
  <path d="M170 255 L200 310 L230 255" stroke="#3F3F46" stroke-width="4" stroke-linecap="round"/>
  <!-- Phone selfie outline -->
  <rect x="175" y="220" width="50" height="90" rx="10" fill="#000000" stroke="#52525B" stroke-width="3"/>
  <circle cx="200" cy="245" r="8" fill="#27272A"/>
  <rect x="190" y="270" width="20" height="3" rx="1.5" fill="#71717A"/>
</svg>
